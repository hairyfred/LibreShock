name: Release

# Builds a signed release APK and attaches it to a GitHub Release whenever a
# version tag is pushed (e.g. `git tag v0.1.0 && git push --tags`).
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64-encoded contents of your release keystore
#   KEYSTORE_PASSWORD  password for the keystore
#   KEY_ALIAS          key alias inside the keystore (e.g. "libreshock")
#   KEY_PASSWORD       password for the key

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed to create the release and upload the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/android/keystore.jks

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK with version tag
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/libreshock-${{ github.ref_name }}.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/libreshock-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
